<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				width: 1200px;
				height: 630px;
				background: #fafaf9;
				font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
			}

			.frame {
				position: relative;
				width: 1200px;
				height: 630px;
				display: flex;
				flex-direction: column;
				justify-content: center;
				padding: 0 96px;
			}

			.eyebrow {
				font-size: 15px;
				letter-spacing: 0.16em;
				text-transform: uppercase;
				font-weight: 600;
				color: #78716c;
				margin-bottom: 28px;
			}

			h1 {
				font-size: 76px;
				font-weight: 600;
				letter-spacing: -0.02em;
				color: #1c1917;
				line-height: 1.05;
			}

			p {
				margin-top: 26px;
				font-size: 30px;
				color: #57534e;
				max-width: 780px;
				line-height: 1.4;
			}

			.rule {
				position: absolute;
				bottom: 64px;
				left: 96px;
				right: 96px;
				height: 1px;
				background: #e7e5e4;
			}

			.url {
				position: absolute;
				bottom: 40px;
				left: 96px;
				font-size: 22px;
				color: #a8a29e;
				letter-spacing: 0.02em;
			}
		</style>
	</head>
	<body>
		<div class="frame">
			<div class="eyebrow">Platform &amp; DevSecOps Engineer</div>
			<h1>Philip Nordquist</h1>
			<p>
				Cloud platforms, security operations, and deep networking &mdash; plus the automation around
				them.
			</p>
			<div class="rule"></div>
			<div class="url">philip.nordquist.me</div>
		</div>
	</body>
</html>
